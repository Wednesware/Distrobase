[project]
name = "distrobase"
version = "26.4"
description = "Open platform for hosting and distributing software online through namespaces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]
